name: Build

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: swift build (${{ matrix.build-system }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        build-system: [native, swiftbuild]
    env:
      BUILD_SYSTEM: ${{ matrix.build-system }}
    steps:
      - uses: actions/checkout@v4

      - name: Report toolchain
        run: swift --version

      - name: macOS
        run: swift build --build-system "$BUILD_SYSTEM"

      - name: iOS
        if: '!cancelled()'
        run: |
          swift build --build-system "$BUILD_SYSTEM" --sdk "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -Xswiftc -target -Xswiftc "arm64-apple-ios$(xcrun --sdk iphoneos --show-sdk-version)"

      - name: tvOS
        if: '!cancelled()'
        run: |
          swift build --build-system "$BUILD_SYSTEM" --sdk "$(xcrun --sdk appletvos --show-sdk-path)" \
            -Xswiftc -target -Xswiftc "arm64-apple-tvos$(xcrun --sdk appletvos --show-sdk-version)"

      - name: watchOS
        if: '!cancelled()'
        run: |
          swift build --build-system "$BUILD_SYSTEM" --sdk "$(xcrun --sdk watchos --show-sdk-path)" \
            -Xswiftc -target -Xswiftc "arm64_32-apple-watchos$(xcrun --sdk watchos --show-sdk-version)"
